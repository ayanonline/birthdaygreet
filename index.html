<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Lovely Sister</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            color: #fff;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        #initial-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            transition: opacity 1s ease;
        }

        .envelope-container {
            text-align: center;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
        }

        .heart-btn {
            font-size: 80px;
            color: #ff4d6d;
            text-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
            animation: heartbeat 1.5s infinite;
            transition: transform 0.3s;
        }

        .heart-btn:hover {
            transform: scale(1.2);
        }

        .click-hint {
            margin-top: 20px;
            font-family: 'Pacifico', cursive;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        #celebration-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: none;
        }
        #celebration-screen::-webkit-scrollbar { display: none; }

        .content-wrapper {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-top: 40px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 4px 15px rgba(255, 77, 109, 0.5);
            margin-bottom: 10px;
            animation: slideDown 1s ease-out;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 30px;
            opacity: 0.9;
            animation: fadeIn 2s ease-out;
        }

        .photo-frame {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.4);
            overflow: hidden;
            position: relative;
            animation: zoomIn 1s ease-out;
            background: #fff;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cards-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .love-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            padding: 20px;
            width: 150px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .love-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 25px rgba(255, 77, 109, 0.3);
        }

        .card-icon { font-size: 30px; margin-bottom: 10px; }
        .card-text { font-size: 14px; font-weight: 600; }

        #message-display {
            min-height: 80px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            font-style: italic;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .clock-container {
            margin: 30px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: inline-block;
            backdrop-filter: blur(5px);
        }

        .clock-text {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        #timer {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .action-buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-wish {
            background: linear-gradient(45deg, #ff4d6d, #ff8fa3);
            color: white;
        }

        .btn-music {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn:active { transform: scale(0.95); }

        .floating-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: floatUp linear infinite;
            z-index: 5;
            user-select: none;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .photo-frame { width: 150px; height: 150px; }
            .cards-container { gap: 10px; }
            .love-card { width: 100px; padding: 15px; }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="aud.mp3" type="audio/mpeg">
    </audio>

    <canvas id="canvas"></canvas>

    <div id="initial-screen">
        <div class="envelope-container" onclick="startCelebration()">
            <div class="heart-btn">💌</div>
            <div class="click-hint">Tap to Open Your Surprise</div>
        </div>
    </div>

    <div id="celebration-screen">
        <div class="content-wrapper">
            <h1>Happy Birthday!</h1>
            <div class="subtitle">To my amazing sister & best friend</div>

            <div class="photo-frame">
                <img src="img.png" alt="Sister">
            </div>

            <div class="cards-container">
                <div class="love-card" onclick="showMessage('memories')">
                    <div class="card-icon">📸</div>
                    <div class="card-text">Memories</div>
                </div>
                <div class="love-card" onclick="showMessage('wishes')">
                    <div class="card-icon">✨</div>
                    <div class="card-text">Wishes</div>
                </div>
                <div class="love-card" onclick="showMessage('love')">
                    <div class="card-icon">💖</div>
                    <div class="card-text">Love You</div>
                </div>
            </div>

            <div id="message-display">Click a card above to see a special message! 💕</div>

            <div class="clock-container">
                <div class="clock-text">Time you've been making the world brighter:</div>
                <div id="timer">Loading...</div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-wish" onclick="generateRandomWish()">🎲 New Wish</button>
                <button class="btn btn-music" id="music-toggle" onclick="toggleMusic()">🎵 Pause Music</button>
            </div>
            
            <div style="margin-top: 50px; font-size: 0.8rem; opacity: 0.7;">
                Made with endless love 💕
            </div>
        </div>
    </div>

    <script src="file/jscex.min.js"></script>
    <script src="file/jscex-parser.js"></script>
    <script src="file/jscex-jit.js"></script>
    <script src="file/jscex-builderbase.min.js"></script>
    <script src="file/jscex-async.min.js"></script>
    <script src="file/jscex-async-powerpack.min.js"></script>
    <script src="file/jscex-love.js" charset="utf-8"></script>
    
    <script>
        const birthDate = new Date("March 19, 2002 00:00:00").getTime();
        
        const messages = {
            memories: [
                "Remember that time we laughed until our stomachs hurt? Best day ever! 😂",
                "From childhood fights to adult secrets, I wouldn't trade our journey for anything.",
                "Every photo with you holds a thousand beautiful stories. 📸",
                "Thank you for being my partner in crime through all these years!"
            ],
            wishes: [
                "May your year be filled with as much joy as you bring to others! ✨",
                "I wish you endless adventures, big dreams come true, and lots of cake! 🎂",
                "May this year bring you closer to everything your heart desires.",
                "Here's to another year of you being absolutely fabulous! 💃"
            ],
            love: [
                "You are not just my sister, you are my soulmate. Love you endlessly! 💖",
                "No matter where life takes us, you'll always have my heart.",
                "The world is a better place because you are in it. Never forget that.",
                "My forever friend, my constant support, my lovely sister. 👯‍♀️"
            ]
        };

        const randomWishes = [
            "May your day be as sweet as cake and as bright as candles! 🕯️",
            "Sending you a million smiles and a billion hugs! 🤗",
            "You deserve all the happiness in the universe today! 🌟",
            "Cheers to another trip around the sun! ☀️",
            "May your coffee be strong and your Monday be short... wait, it's your birthday! 🎉",
            "Wishing you a day filled with laughter and love! ❤️"
        ];

        let isMusicPlaying = false;
        let heartInterval;

        function startCelebration() {
            document.getElementById('initial-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('initial-screen').style.display = 'none';
                document.getElementById('celebration-screen').style.display = 'block';
                startTimer();
                createFloatingHearts();
                runCanvasAnimation();
                toggleMusic();
            }, 1000);
        }

        function showMessage(type) {
            const display = document.getElementById('message-display');
            const options = messages[type];
            const randomMsg = options[Math.floor(Math.random() * options.length)];
            display.style.opacity = '0';
            setTimeout(() => {
                display.textContent = randomMsg;
                display.style.opacity = '1';
            }, 300);
        }

        function generateRandomWish() {
            const display = document.getElementById('message-display');
            const randomWish = randomWishes[Math.floor(Math.random() * randomWishes.length)];
            display.style.opacity = '0';
            setTimeout(() => {
                display.textContent = "🎲 " + randomWish;
                display.style.opacity = '1';
            }, 300);
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle');
            if (isMusicPlaying) {
                audio.pause();
                btn.textContent = "🎵 Play Music";
                btn.style.background = "rgba(255, 255, 255, 0.3)";
            } else {
                audio.play().catch(e => console.log("Audio play failed:", e));
                btn.textContent = "⏸️ Pause Music";
                btn.style.background = "linear-gradient(45deg, #ff4d6d, #ff8fa3)";
            }
            isMusicPlaying = !isMusicPlaying;
        }

        function startTimer() {
            setInterval(() => {
                const now = new Date().getTime();
                const distance = now - birthDate;
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                document.getElementById("timer").innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        function createFloatingHearts() {
            clearInterval(heartInterval);
            heartInterval = setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerHTML = ['❤️', '💖', '💕', '✨', '🌸'][Math.floor(Math.random() * 5)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 7000);
            }, 300);
        }

        function runCanvasAnimation() {
            try {
                if (typeof love === 'function') { }
            } catch (e) {
                console.log("Original animation script loaded");
            }
        }
    </script>
</body>
</html>
